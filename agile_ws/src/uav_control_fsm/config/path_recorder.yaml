# uav_path_recorder 默认参数（可在 launch 中覆盖）

uav_id: 0

# 轨迹 frame_id，默认 uav{id}_map
# map_frame: uav0_map

# 相邻记录点最小距离 (m)
min_dist: 0.05

# Path 最大点数，超出后丢弃最旧点
max_points: 100

# 是否保存 CSV；默认 false，仅 RViz 显示
# true 时写宽表：实际位姿 + Move_mode + move_command 期望指令
save_to_file: false

# CSV 保存目录，支持 ~/ 前缀
save_dir: ~/flight_logs

# false: 解锁后一直记录到上锁（含降落阶段）
# true:  落地后暂停，再次起飞且仍解锁时继续
stop_on_landing: false

# 再次解锁时清空 RViz 旧轨迹并新建 CSV
clear_path_on_rearm: true

# flight_path 发布频率 (Hz)
path_publish_rate: 10.0
