# traj_tracking_demo 默认参数（仿真 uav_id=0）

uav_id: 0
move_mode: 10              # 10=轨迹(pos+vel前馈) | 0=仅位置
traj_type: figure8          # circle | square | triangle | hexagon | figure8

center_x: 0.0
center_y: 0.0
altitude: 1.5              # 飞行高度 (m)
speed: 1.0                 # 轨迹跟踪速度 (m/s)
approach_speed: 1.0        # 飞往起点/返航速度 (m/s)

# 圆 / 8 字使用 radius；正方形 / 三角形 / 六边形使用 side_length
radius: 3.0                # circle, figure8
side_length: 3.0           # square, triangle, hexagon

num_laps: 3
start_angle_deg: 0.0
clockwise: true

publish_rate: 30.0         # move_command 发布频率 (Hz)
ref_path_sample_step: 0.05 # RViz 参考轨迹采样间距 (m)

auto_start: true
wait_hover_sec: 2.0        # 收到 odom 后等待 (s)，再飞往轨迹起点
finish_action: hover       # hover | land | return_origin_land
arrival_tol: 0.3           # 到达容差 (m)
arrival_hold_sec: 1.0      # 到达后保持时间 (s)
